name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  daemon:
    name: daemon (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
      - name: gofmt check
        run: |
          cd daemon
          diff <(gofmt -l .) <(echo -n "")
      - name: go vet
        run: cd daemon && go vet ./...
      - name: go test
        run: cd daemon && go test ./...
      - name: go build
        run: cd daemon && go build ./...
      - name: schemas up to date
        run: |
          make schema
          git diff --exit-code -- docs/config.schema.json docs/openapi.json docs/device-layout.json

  ui:
    name: ui (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci
      - name: generated types up to date
        run: |
          cd ui && npm run codegen
          cd .. && git diff --exit-code -- ui/src/types/
      - name: typecheck
        run: cd ui && npm run typecheck
      - name: lint
        run: cd ui && npm run lint
      - name: format check
        run: cd ui && npm run format:check
      - name: test
        run: cd ui && npm test
      - name: build (Vite only — the Rust/Tauri build gets its own job below)
        run: cd ui && npx vite build

  ui-rust:
    name: ui (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # webkit2gtk/appindicator/rsvg dev headers -- tauri-build compiles
      # against these even for `cargo test`, so they're needed
      # regardless of whether this job ever runs `tauri build` (it
      # deliberately doesn't -- see the comment on the clippy step).
      - name: install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ui/src-tauri
      - name: cargo fmt --check
        run: cd ui/src-tauri && cargo fmt --check
      - name: cargo clippy
        run: cd ui/src-tauri && cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cd ui/src-tauri && cargo test
      # `tauri build` deliberately isn't run here: bundling is M12's
      # decision (AppImage needs patchelf, which isn't installed, plus a
      # network fetch of linuxdeploy), and `cargo build`/`cargo test`
      # already prove the code compiles and links -- a full bundle step
      # would add minutes for no additional signal.
