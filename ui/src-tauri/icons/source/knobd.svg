<?xml version="1.0" encoding="UTF-8"?>
<!--
  knobd's app icon: an encoder knob with its 13-segment LED ring, 7 of
  the 11 addressable segments lit, matching the real X-Touch Mini's
  ring geometry and the "fill" LED mode knobd's engine uses for volume
  display (see specs/reference/xtouch-mini-midi-map.md). Regenerate the
  bundle icon set from this file with `make ui-icons`.
-->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232733"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <radialGradient id="knob" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4A5568"/>
      <stop offset="100%" stop-color="#2A2F3A"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- ring: 13 segments, 8 lit (the two "bezel mark" ends plus 6 of the
       11 addressable positions), mirroring device.EncodeLED's mode 2. -->
  <g>
    <line x1="362.00" y1="771.81" x2="322.00" y2="841.09" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="266.25" y1="684.07" x2="200.72" y2="729.96" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="216.56" y1="564.09" x2="137.77" y2="577.99" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="222.22" y1="434.35" x2="144.95" y2="413.65" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="282.19" y1="319.16" x2="220.90" y2="267.74" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="385.21" y1="240.11" x2="351.41" y2="167.60" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="512.00" y1="212.00" x2="512.00" y2="132.00" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="638.79" y1="240.11" x2="672.59" y2="167.60" stroke="#5CC8C2" stroke-width="30" stroke-linecap="round"/>
    <line x1="741.81" y1="319.16" x2="803.10" y2="267.74" stroke="#3A4250" stroke-width="30" stroke-linecap="round"/>
    <line x1="801.78" y1="434.35" x2="879.05" y2="413.65" stroke="#3A4250" stroke-width="30" stroke-linecap="round"/>
    <line x1="807.44" y1="564.09" x2="886.23" y2="577.99" stroke="#3A4250" stroke-width="30" stroke-linecap="round"/>
    <line x1="757.75" y1="684.07" x2="823.28" y2="729.96" stroke="#3A4250" stroke-width="30" stroke-linecap="round"/>
    <line x1="662.00" y1="771.81" x2="702.00" y2="841.09" stroke="#3A4250" stroke-width="30" stroke-linecap="round"/>
  </g>

  <!-- the knob body itself, with a position indicator matching the lit
       arc above. -->
  <circle cx="512" cy="512" r="240" fill="url(#knob)" stroke="#181B22" stroke-width="8"/>
  <line x1="512" y1="512" x2="512" y2="330" stroke="#5CC8C2" stroke-width="20" stroke-linecap="round" transform="rotate(-35 512 512)"/>
  <circle cx="512" cy="512" r="240" fill="none" stroke="#00000022" stroke-width="4"/>
</svg>
