[package]
name = "knobd-ui"
version = "0.0.0"
description = "Configuration UI for knobd"
edition = "2021"
# Tauri 2's actual MSRV; the old 1.75 floor here predated the tauri
# dependency being added and was never checked against it.
rust-version = "1.78"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TODO(M07): add whatever unix-socket HTTP client we end up proxying
# through to knobd's api package (see ../src/api/client.ts) — likely
# `hyper` + `hyperlocal`, or a thin custom client, once
# daemon/internal/api actually serves something to talk to.

[lib]
name = "knobd_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
